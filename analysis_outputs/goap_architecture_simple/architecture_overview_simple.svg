<text x="572.0" y="497.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#64748B">blocked/open paths</text>
<rect x="105.0" y="720.0" width="1190.0" height="58" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
<text x="700.0" y="743.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">
<tspan x="700.0" dy="0">The planner produces local action sequences, but the environment controls which transport nodes and resources are currently accessible. When those conditions change, agents</tspan>
<tspan x="700.0" dy="17">roll back temporary reservations and replan against the updated world state.</tspan>
