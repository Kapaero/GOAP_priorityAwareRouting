<polyline points="940,155 905,155 905,80 170,80 170,115" fill="none" stroke="#B91C1C" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
<text x="555" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#B91C1C">replan</text>

<polyline points="750,195 750,275 375,275 375,390" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">effects</text>

<polyline points="325,390 325,245 170,245 170,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
