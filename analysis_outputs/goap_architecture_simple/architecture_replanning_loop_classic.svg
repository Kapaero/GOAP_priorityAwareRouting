<rect x="650" y="115" width="200" height="80" rx="6" fill="#FFF7ED" stroke="#D98C28" stroke-width="2"/>
<text x="750" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Action Executor</text>

<rect x="940" y="115" width="200" height="80" rx="6" fill="#FEF2F2" stroke="#C85A54" stroke-width="2"/>
