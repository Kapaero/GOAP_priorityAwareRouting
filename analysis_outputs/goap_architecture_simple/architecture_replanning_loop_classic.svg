<polyline points="360,410 460,410 460,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="485" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(-90 485 310)">snapshot</text>

<line x1="435" y1="420" x2="525" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">queue</text>

<line x1="525" y1="450" x2="435" y2="450" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">change++</text>

<line x1="745" y1="433" x2="835" y2="433" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="790" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">availability</text>

<polyline points="750,195 750,255 945,255 945,390" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="850" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">uses</text>
