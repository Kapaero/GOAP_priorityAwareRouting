<rect x="215" y="390" width="220" height="85" rx="6" fill="#F0FDF4" stroke="#4F9D69" stroke-width="2"/>
<text x="325" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Shared World State</text>

<rect x="525" y="390" width="220" height="85" rx="6" fill="#FEF2F2" stroke="#C85A54" stroke-width="2"/>
<text x="635" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">
<tspan x="635" dy="0">Environment</tspan>
<tspan x="635" dy="20">Manager</tspan>
</text>

<rect x="835" y="390" width="220" height="85" rx="6" fill="#FFF7ED" stroke="#D98C28" stroke-width="2"/>
<text x="945" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Hospital Resources</text>

<line x1="270" y1="155" x2="360" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">request</text>

<line x1="560" y1="155" x2="650" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="605" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">plan</text>

<line x1="850" y1="155" x2="940" y2="155" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#arrowRed)"/>
