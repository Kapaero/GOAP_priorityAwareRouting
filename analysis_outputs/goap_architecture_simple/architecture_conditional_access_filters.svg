<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="620" viewBox="0 0 1220 620">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
</marker>
<marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M2,2 L10,6 L2,10 Z" fill="#B91C1C"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="610" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Environment-Mediated GOAP with Conditional Resource Access</text>

<rect x="70" y="115" width="200" height="80" rx="6" fill="#EFF6FF" stroke="#2F6FA3" stroke-width="2"/>
<text x="170" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Patient Agent</text>

<rect x="370" y="115" width="200" height="80" rx="6" fill="#EFF6FF" stroke="#4E79A7" stroke-width="2"/>
<text x="470" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">GOAP Planner</text>

<rect x="670" y="115" width="200" height="80" rx="6" fill="#FFF7ED" stroke="#D98C28" stroke-width="2"/>
<text x="770" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Action Executor</text>

<rect x="950" y="115" width="200" height="80" rx="6" fill="#FEF2F2" stroke="#C85A54" stroke-width="2"/>
<text x="1050" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">
<tspan x="1050" dy="0">Emergency</tspan>
<tspan x="1050" dy="20">Rollback</tspan>
</text>

<rect x="160" y="390" width="220" height="85" rx="6" fill="#F0FDF4" stroke="#4F9D69" stroke-width="2"/>
<text x="270" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Shared World State</text>

<rect x="500" y="390" width="220" height="85" rx="6" fill="#FEF2F2" stroke="#C85A54" stroke-width="2"/>
<text x="610" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">
<tspan x="610" dy="0">Environment</tspan>
<tspan x="610" dy="20">Manager</tspan>
</text>

<rect x="840" y="375" width="250" height="115" rx="6" fill="#FFF7ED" stroke="#D98C28" stroke-width="2"/>
<text x="965" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2937">Hospital Resources</text>
<text x="965" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">
<tspan x="965" dy="0">node-level access filters</tspan>
<tspan x="965" dy="18">priority, status, occupancy</tspan>
</text>

<line x1="270" y1="155" x2="370" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">goal + attributes</text>

<line x1="570" y1="155" x2="670" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">plan</text>

<line x1="870" y1="155" x2="950" y2="155" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#arrowRed)"/>
<text x="910" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#B91C1C">invalid target</text>

<polyline points="1050,195 1050,285 340,285 340,390" fill="none" stroke="#B91C1C" stroke-width="2.2" marker-end="url(#arrowRed)"/>
<text x="695" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#B91C1C">release resources</text>

<polyline points="950,155 910,155 910,80 170,80 170,115" fill="none" stroke="#B91C1C" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrowRed)"/>
<text x="560" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#B91C1C">replan</text>

<polyline points="270,390 270,250 470,250 470,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="370" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">environment snapshot</text>

<polyline points="770,195 770,290 965,290 965,375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="868" y="279" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">uses target</text>

<polyline points="170,195 170,318 900,318 900,375" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="535" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">priority / status / queue position</text>

<polyline points="840,430 790,430 790,195" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="813" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569" transform="rotate(-90 813 315)">accepted / rejected</text>

<polyline points="725,195 725,260 380,260 380,420" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="553" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">effects</text>

<line x1="380" y1="422" x2="500" y2="422" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">queue / occupancy</text>

<line x1="500" y1="452" x2="380" y2="452" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="440" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">world change</text>

<line x1="720" y1="432" x2="840" y2="432" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="780" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">availability rules</text>
</svg>
