<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Simulation Environment Floor Plan</title>
  <desc id="desc">Simplified floor plan of the simulated triage transport environment with corridors A, B, C, two treatment wings, and a waiting room.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#243247" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="corridor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef5fa"/>
      <stop offset="1" stop-color="#dfeaf1"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="#fbfaf7"/>
  <text x="44" y="58" fill="#152132" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Simulation Environment Floor Plan</text>
  <line x1="44" y1="80" x2="548" y2="80" stroke="#2f73aa" stroke-width="2"/>

  <g transform="translate(105 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="430" height="770" fill="#fbfaf7" stroke="#20272e" stroke-width="10"/>
    <rect x="430" y="360" width="430" height="130" fill="url(#corridor)" stroke="#20272e" stroke-width="10"/>
    <rect x="850" y="360" width="450" height="410" fill="#fbfaf7" stroke="#20272e" stroke-width="10"/>
    <rect x="515" y="315" width="95" height="55" fill="#fbfaf7" stroke="#20272e" stroke-width="10"/>
    <rect x="520" y="490" width="55" height="270" fill="#fbfaf7" stroke="#20272e" stroke-width="10"/>

    <rect x="80" y="120" width="245" height="470" fill="url(#corridor)" stroke="#20272e" stroke-width="5"/>
    <rect x="80" y="590" width="350" height="115" fill="url(#corridor)" stroke="#20272e" stroke-width="5"/>
    <rect x="80" y="120" width="245" height="86" fill="url(#corridor)" stroke="#20272e" stroke-width="3"/>
    <rect x="200" y="95" width="135" height="86" fill="url(#corridor)" stroke="#20272e" stroke-width="3"/>

    <text x="205" y="150" fill="#20272e" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Corridor C</text>
    <text x="112" y="360" fill="#20272e" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" transform="rotate(90 112 360)">Corridor B</text>
    <text x="288" y="360" fill="#20272e" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" transform="rotate(90 288 360)">Corridor A</text>
    <text x="1075" y="695" fill="#20272e" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">Waiting room</text>

    <g fill="none" stroke="#20272e" stroke-width="5">
      <line x1="80" y1="590" x2="80" y2="705"/>
      <line x1="430" y1="590" x2="430" y2="705"/>
      <line x1="170" y1="0" x2="170" y2="100"/>
      <line x1="260" y1="0" x2="260" y2="70"/>
      <line x1="325" y1="0" x2="325" y2="85"/>

