  <g transform="translate(44 835)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="-24" width="16" height="16" fill="url(#corridor)" stroke="#20272e" stroke-width="2"/>
    <text x="26" y="-10" fill="#526070" font-size="15">Transit corridors / conditional nodes</text>
    <rect x="260" y="-24" width="16" height="16" fill="#fbfaf7" stroke="#20272e" stroke-width="2"/>
    <text x="286" y="-10" fill="#526070" font-size="15">Assessment rooms, buffers, and waiting zones</text>
