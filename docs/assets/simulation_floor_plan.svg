      <line x1="170" y1="120" x2="170" y2="500"/>
      <line x1="220" y1="120" x2="220" y2="500"/>
      <line x1="270" y1="120" x2="270" y2="500"/>
      <line x1="120" y1="200" x2="270" y2="200"/>
      <line x1="120" y1="250" x2="270" y2="250"/>
      <line x1="120" y1="300" x2="270" y2="300"/>
      <line x1="120" y1="360" x2="270" y2="360"/>
      <line x1="120" y1="410" x2="270" y2="410"/>
      <line x1="120" y1="480" x2="270" y2="480"/>

      <line x1="490" y1="405" x2="800" y2="405"/>
      <line x1="490" y1="490" x2="800" y2="490"/>
      <line x1="575" y1="405" x2="575" y2="490"/>
      <line x1="650" y1="405" x2="650" y2="490"/>
      <line x1="705" y1="405" x2="705" y2="490"/>
      <line x1="760" y1="405" x2="760" y2="490"/>

      <line x1="980" y1="360" x2="980" y2="490"/>
      <line x1="1045" y1="360" x2="1045" y2="490"/>
      <line x1="1110" y1="360" x2="1110" y2="490"/>
      <line x1="1175" y1="360" x2="1175" y2="490"/>
      <line x1="1240" y1="360" x2="1240" y2="490"/>

      <polyline points="1065,690 1195,690 1195,775 1065,775"/>
      <line x1="1110" y1="640" x2="1110" y2="690"/>
      <line x1="1160" y1="640" x2="1160" y2="690"/>
      <line x1="1210" y1="640" x2="1210" y2="690"/>
      <line x1="1260" y1="640" x2="1260" y2="690"/>

      <line x1="610" y1="735" x2="835" y2="735"/>
      <line x1="945" y1="735" x2="1300" y2="735"/>
