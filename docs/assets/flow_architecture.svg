<rect x="60.0" y="760.0" width="1210.0" height="72.0" rx="8" fill="#EDF2F7" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="665.0" y="787.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">
<tspan x="665.0" dy="0">Key idea: the planner is not the only controller. The environment itself changes through target availability and world-state counters, forcing agents to invalidate obsolete</tspan>
<tspan x="665.0" dy="17">plans and replan online.</tspan>
