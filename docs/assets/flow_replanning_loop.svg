<text x="655.0" y="826.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">
<tspan x="655.0" dy="0">EmergencyPerform is the safety valve: it removes temporary action modifiers, returns reserved resources, and lets the agent build a new plan only after the world has</tspan>
